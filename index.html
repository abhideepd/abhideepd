<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Abhideep Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --bg-1: #0b1120;
  --bg-2: #111827;
  --bg-3: #0f172a;
  --card: rgba(15, 23, 42, 0.78);
  --card-border: rgba(148, 163, 184, 0.18);
  --text: #e2e8f0;
  --muted: #cbd5e1;
  --shadow: 0 25px 45px rgba(2, 6, 23, 0.5);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes floatGlow {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
}

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background:
    radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 30%),
    radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.14), transparent 25%),
    linear-gradient(135deg, var(--bg-1), var(--bg-2) 42%, var(--bg-3));
  color: var(--text);
  position: relative;
  overflow-x: hidden;
}

body::before,
body::after {
  content: "";
  position: fixed;
  width: 240px;
  height: 240px;
  border-radius: 9999px;
  filter: blur(18px);
  opacity: 0.5;
  z-index: 0;
  pointer-events: none;
}

body::before {
  top: 8%;
  left: -40px;
  background: rgba(96, 165, 250, 0.22);
  animation: floatGlow 12s ease-in-out infinite;
}

body::after {
  right: -30px;
  bottom: 12%;
  background: rgba(45, 212, 191, 0.18);
  animation: floatGlow 16s ease-in-out infinite reverse;
}

.animate-fade-in { animation: fadeIn 0.35s ease-in-out; }

.page-shell {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 20px 64px;
}

.hero-card {
  background: rgba(15, 23, 42, 0.72);
  border: 1px solid var(--card-border);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 28px;
  box-shadow: var(--shadow);
  padding: 28px 24px;
  margin-bottom: 24px;
  text-align: center;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(168, 85, 247, 0.12));
  border: 1px solid rgba(147, 197, 253, 0.15);
  color: #bfdbfe;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 7px 12px;
  border-radius: 9999px;
  margin-bottom: 18px;
}

.hero-title {
  margin: 0 0 14px;
  font-size: clamp(2.1rem, 4vw, 3.1rem);
  line-height: 1.15;
  font-weight: 800;
  letter-spacing: -0.04em;
  background: linear-gradient(135deg, #e2e8f0, #93c5fd, #c4b5fd);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero-subtitle {
  margin: 0;
  color: var(--muted);
  font-size: clamp(1rem, 2vw, 1.08rem);
  line-height: 1.7;
  font-weight: 500;
  letter-spacing: 0.01em;
}

.blog-pill {
  display: inline-block;
  margin-left: 6px;
  padding: 0.35rem 0.8rem;
  border-radius: 9999px;
  background: linear-gradient(135deg, #3b82f6, #4f46e5);
  color: #ffffff !important;
  box-shadow: 0 12px 20px rgba(59, 130, 246, 0.22);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  text-decoration: none !important;
}

.blog-pill:hover {
  transform: translateY(-1px);
  box-shadow: 0 16px 24px rgba(59, 130, 246, 0.28);
}

#sections {
  display: grid;
  gap: 18px;
}

.section-card {
  position: relative;
  overflow: hidden;
  border-radius: 22px;
  border: 1px solid rgba(148, 163, 184, 0.2);
  background: rgba(15, 23, 42, 0.75);
  box-shadow: 0 18px 35px rgba(15, 23, 42, 0.25);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.section-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 20px 40px rgba(15, 23, 42, 0.1);
}

.accordion-btn {
  width: 100%;
  border: none;
  background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
  color: white;
  text-align: left;
  padding: 1rem 1.2rem;
  font-size: 1.08rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: filter 0.2s ease, transform 0.2s ease;
}

.accordion-btn:hover {
  filter: brightness(1.03);
}

.accordion-btn:focus-visible {
  outline: 3px solid rgba(255,255,255,0.7);
  outline-offset: -3px;
}

.accordion-btn svg {
  width: 1.15rem;
  height: 1.15rem;
  transition: transform 0.25s ease;
  flex-shrink: 0;
}

.accordion-btn .rotate-180 {
  transform: rotate(180deg);
}

.section-content {
  background: rgba(15, 23, 42, 0.9);
  padding: 1.2rem 1.3rem 1.35rem;
  color: var(--muted);
  line-height: 1.7;
}

.section-content a {
  color: #7dd3fc;
  text-decoration: none;
  font-weight: 600;
  transition: color 0.2s ease, opacity 0.2s ease;
}

.section-content a:hover {
  color: #bae6fd;
  text-decoration: underline;
}

.section-content ul,
.section-content ol {
  margin: 0;
  padding-left: 1.25rem;
}

.section-content li + li {
  margin-top: 0.35rem;
}

.section-content strong {
  color: var(--text);
}

.section-content blockquote {
  margin: 0 0 1rem;
  padding: 0.8rem 1rem;
  border-left: 4px solid #14b8a6;
  background: rgba(20, 184, 166, 0.08);
  border-radius: 0 12px 12px 0;
  color: var(--text);
  font-style: italic;
}

.section-content > *:last-child {
  margin-bottom: 0;
}

@media (max-width: 640px) {
  .page-shell { padding: 20px 14px 46px; }
  .hero-card { padding: 22px 18px; }
  .accordion-btn { padding: 0.9rem 1rem; }
  .section-content { padding: 1rem 1rem 1.1rem; }
}
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="page-shell">
  <header class="hero-card">
    <div class="hero-badge">Portfolio</div>
    <h1 class="hero-title">Abhideep Das</h1>
    <p class="hero-subtitle">
      Backend Developer | Java &amp; Spring Boot Enthusiast | Continuous Learner | Problem Solver | <a class="blog-pill" href="https://abhideepd.github.io/myBlog/" target="_blank">my Blog</a>
    </p>
  </header>

  <div id="sections" class="space-y-4"></div>
</div>

<script>
const sections = [
  {
    id: 'resume',
    title: '📄 Resume & Profiles',
    color: 'from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700',
    content: `
      <ul class="space-y-2">
        <li>📄 <a href="https://drive.google.com/file/d/1LaNCUHdzn3MVPCTTT6gImOeOMr2csz-Q/view?usp=sharing" target="_blank" class="text-blue-600 hover:text-blue-800">My Resume</a></li>
        <li>💼 <a href="https://www.linkedin.com/in/imabhideep/" target="_blank" class="text-blue-600 hover:text-blue-800">LinkedIn</a></li>
        <li><a href="https://www.hackerrank.com/profile/abhideepd" target="_blank" class="text-blue-600 hover:text-blue-800">HackerRank Profile</a></li>
        <li><a href="https://leetcode.com/u/IMABHIDEEP/" target="_blank" class="text-blue-600 hover:text-blue-800">LeetCode Profile</a></li>
        <li><a href="https://github.com/abhideepd" target="_blank" class="text-blue-600 hover:text-blue-800">GitHub profile</a></li>
      </ul>
    `
  },
  {
    id: 'opensource',
    title: '🤝 Open Source Contributions',
    color: 'from-green-500 to-green-600 hover:from-green-600 hover:to-green-700',
    content: `
      <ul class="space-y-3">
        <li><strong><a href="https://github.com/angular/angular" target="_blank" class="text-blue-600 hover:text-blue-800">Angular</a>:</strong>
          <ul class="ml-6 mt-1">
            <li><a href="https://github.com/angular/angular/pulls?q=is%3Apr+is%3Aclosed+author%3Aabhideepd" target="_blank" class="text-blue-600 hover:text-blue-800">Merged PRs</a></li>
          </ul>
        </li>
        <li><strong><a href="https://github.com/cpinitiative/usaco-guide" target="_blank" class="text-blue-600 hover:text-blue-800">USACO Guide</a>:</strong>
          <ul class="ml-6 mt-1">
            <li><a href="https://github.com/cpinitiative/usaco-guide/pulls?q=is%3Apr+is%3Aclosed+author%3Aabhideepd" target="_blank" class="text-blue-600 hover:text-blue-800">Merged PRs</a></li>
          </ul>
        </li>
      </ul>
      <p class="mt-4 text-gray-700 italic">Contributing to open source has shaped the way I write and think about code—clean commits, meaningful PRs, and readable documentation.</p>
    `
  },
  {
    id: 'projects',
    title: '🔗 Personal Projects',
    color: 'from-purple-500 to-purple-600 hover:from-purple-600 hover:to-purple-700',
    content: `
      <div class="space-y-4">
        <div>🌀 <a href="https://abhideepd.github.io/myBlog/" target="_blank" class="text-blue-600 hover:text-blue-800 font-semibold">myBlog</a>: A minimalist blog engine using Flask and Markdown.</div>
        <div>🔬 <a href="https://abhideepd.github.io/Tic-Tac-Toe/" target="_blank" class="text-blue-600 hover:text-blue-800 font-semibold">n*n tic tac toe</a>: A complete frontend n*n tic tac toe with 3 modes—manual, vs computer, and computer vs computer.
          <div class="mt-1"><a href="https://github.com/abhideepd/Tic-Tac-Toe" target="_blank" class="text-blue-500 hover:text-blue-700 text-sm">tic-tac-toe repo link</a></div>
        </div>
        <div>🧪 <a href="https://abhideepd.github.io/typemint/" target="_blank" class="text-blue-600 hover:text-blue-800 font-semibold">typemint</a>: A custom touch typing website with advanced analytics.
          <div class="mt-1"><a href="https://github.com/abhideepd/typemint" target="_blank" class="text-blue-500 hover:text-blue-700 text-sm">typemint repo link</a></div>
        </div>
      </div>
    `
  },
  {
    id: 'achievements',
    title: '🌟 Achievements',
    color: 'from-yellow-500 to-yellow-600 hover:from-yellow-600 hover:to-yellow-700',
    content: `
      <ul class="space-y-2">
        <li>🏆 Solved 700+ problems across platforms</li>
        <li>Top 32% worldwide on LeetCode and 6-star on HackerRank</li>
        <li>📜 Completed courses on backend development and system design</li>
        <li>🧠 Built custom tools as personal experiments</li>
        <li>🥇 Top contributor in collaborative coding groups</li>
      </ul>
    `
  },
  {
    id: 'techstack',
    title: '💡 Tech Stack',
    color: 'from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700',
    content: `
      <ul class="space-y-2">
        <li><strong>Languages:</strong> Java, JavaScript, Python</li>
        <li><strong>Backend:</strong> Spring Boot, REST APIs, MySQL, PostgreSQL</li>
        <li><strong>Frontend:</strong> Angular (basic), HTML, CSS</li>
        <li><strong>Tools:</strong> Git, GitHub, Postman, Docker (basics), Maven</li>
        <li><strong>Other:</strong> DSA, Multithreading, System Design (beginner)</li>
      </ul>
    `
  },
  {
    id: 'about',
    title: '🧑‍💻 About Me',
    color: 'from-red-500 to-red-600 hover:from-red-600 hover:to-red-700',
    content: `
      <p class="mb-4">I'm a developer who enjoys building meaningful things...</p>
      <p class="mb-3">I'm especially passionate about:</p>
      <ul class="space-y-1 mb-4 ml-6">
        <li>• Crafting clean and maintainable code</li>
        <li>• Contributing to open source</li>
        <li>• Solving real-world problems with tech</li>
      </ul>
      <p>I'm always open to interesting challenges and collaborations! 🚀</p>
    `
  },
  {
    id: 'connect',
    title: '💬 Let\'s Connect',
    color: 'from-teal-500 to-teal-600 hover:from-teal-600 hover:to-teal-700',
    content: `
      <p class="mb-4">I love connecting with curious and passionate people...</p>
      <blockquote class="border-l-4 border-teal-500 pl-4 italic mb-4 text-gray-700">
        "Code is not just what we write, it's how we think." ✨
      </blockquote>
      <a href="https://x.com/BHIDEEP" target="_blank" class="text-blue-600 hover:text-blue-800">twitter</a>
    `
  }
];

const container = document.getElementById('sections');
sections.forEach(sec => {
  const wrapper = document.createElement('div');
  wrapper.className = "section-card";
  wrapper.innerHTML = `
    <button class="accordion-btn bg-gradient-to-r ${sec.color}">
      <span>${sec.title}</span>
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>
    <div class="content section-content hidden">${sec.content}</div>
  `;
  const btn = wrapper.querySelector('button');
  const icon = btn.querySelector('svg');
  const contentDiv = wrapper.querySelector('.content');
  btn.addEventListener('click', () => {
    const isOpen = !contentDiv.classList.contains('hidden');
    contentDiv.classList.toggle('hidden');
    if (!isOpen) {
      contentDiv.classList.add('animate-fade-in');
      icon.classList.add('rotate-180');
    } else {
      icon.classList.remove('rotate-180');
    }
  });
  container.appendChild(wrapper);
});
</script>
</body>
</html>
