    content: `

const container = document.getElementById('sections');
sections.forEach(sec => {
  const wrapper = document.createElement('div');
  wrapper.className = "bg-white rounded-lg shadow-md overflow-hidden";
  wrapper.innerHTML = `
    <button class="w-full px-6 py-4 text-left bg-gradient-to-r ${sec.color} text-white font-semibold text-lg flex items-center justify-between transition-colors">
      <span>${sec.title}</span>
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>
    <div class="content px-6 py-4 hidden">${sec.content}</div>
  `;
  const btn = wrapper.querySelector('button');
  const icon = btn.querySelector('svg');
  const contentDiv = wrapper.querySelector('.content');
  btn.addEventListener('click', () => {
    const isOpen = !contentDiv.classList.contains('hidden');
    contentDiv.classList.toggle('hidden');
    if (!isOpen) {
      contentDiv.classList.add('animate-fade-in');
      icon.classList.add('rotate-180');
    } else {
      icon.classList.remove('rotate-180');
    }
  });
  container.appendChild(wrapper);
});
</script>
</body>
</html>
